# Q-Diagnose Platform Configuration
# Owner: Arzaan (core config consumed by all modules)

app:
  name: "Q-Diagnose"
  version: "1.0.0"
  debug: false

storage:
  backend: "local"
  base_path: "."         # resolved relative to project root at runtime
  max_file_size_mb: 50
  max_uncompressed_size_gb: 2
  supported_formats:
    - ".csv"
    - ".xlsx"
    - ".zip"
  uploads_dir: "data/uploads"
  demo_dir: "data/demo"

database:
  url: "sqlite:///./mvp.db"

experiment:
  test_size: 0.20
  random_state: 42
  n_components: 8       # PCA components for quantum branch
  candidate_dimensions:
    - 8
  cv_folds: 5

classical_models:
  logistic_regression:
    max_iter: 1000
    random_state: 42
    class_weight: "balanced"
  svm:
    kernel: "rbf"
    C: 1.0
    probability: true
    random_state: 42
    class_weight: "balanced"
  random_forest:
    n_estimators: 100
    max_depth: null
    random_state: 42
    class_weight: "balanced"

quantum_config:
  backend_type: "LOCAL_SIMULATOR"   # LOCAL_SIMULATOR | CLOUD_SIMULATOR | HARDWARE
  backend_name: "qasm_simulator"
  provider: "qiskit_aer"
  shots: 1024
  seed_simulator: 42
  seed_transpiler: 42
  optimization_level: 1
  qubits: 8
  circuit_depth: 2
  ansatz: "RealAmplitudes"
  entanglement: "linear"
  reps: 2
  optimizer: "COBYLA"
  max_iterations: 200
  encoding_type: "ANGLE_ENCODING"

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
